name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test_app:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          node --version
          npm test

  build_app:
    runs-on: ubuntu-latest
    needs: test_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          npm run build
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: devops-lab5-${{ github.sha }}
          path: dist/
          retention-days: 7
